name: tibetan_prayer_app
description: Tibetan Buddhist prayers from all traditions, a Tibetan calendar with prayer-flag days, a mala counter and a 49-day guide.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  just_audio: ^0.9.40
  wakelock_plus: 1.2.8
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  home_widget: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/prayers.json
  fonts:
    - family: Jomolhari
      fonts:
        - asset: assets/fonts/Jomolhari-Regular.ttf
    - family: NotoSerifTibetan
      fonts:
        - asset: assets/fonts/NotoSerifTibetan.ttf
    - family: Spectral
      fonts:
        - asset: assets/fonts/Spectral-Regular.ttf
        - asset: assets/fonts/Spectral-Italic.ttf
          style: italic
        - asset: assets/fonts/Spectral-SemiBold.ttf
          weight: 600

dependency_overrides:
  package_info_plus: ^8.0.0
